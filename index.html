<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Language Translator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <h1>My Language Translator</h1>
    <p class="subtitle">Translate text instantly between languages</p>

    <div class="language-box">
      <select id="sourceLang">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>

      <button id="swapBtn">⇄</button>

      <select id="targetLang">
        <option value="hi">Hindi</option>
        <option value="en">English</option>
      </select>
    </div>

    <textarea id="inputText" placeholder="Enter text to translate..."></textarea>

    <button id="translateBtn">Translate</button>

    <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>

    <div class="actions">
      <button id="copyBtn">Copy</button>
      <button id="speakBtn">Speak</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
